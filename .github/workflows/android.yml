name: Android

# Every push and PR: run the unit tests and build the release APK.
# Push to main with a versionName that has no release yet: publish that
# release (tag v<versionName>, teleprompter-v<versionName>.apk + SHA-256).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Release APKs are signed with the debug key (app/build.gradle.kts).
      # Android only updates an installed app signed with the same key, so the
      # key that signed earlier releases comes from a secret. Without it, the
      # runner's throwaway key is fine for testing, but no release is published.
      - name: Install signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Unit tests and release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Name and hash the APK
        id: apk
        run: |
          V=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          APK="teleprompter-v$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk }}
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "v$V is already released; bump versionName to publish a new one."
            exit 0
          fi
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set: an APK signed with the runner's key would not install over existing releases. Not publishing v$V."
            exit 1
          fi
          NOTES="docs/release-notes/v$V.md"
          if [ -f "$NOTES" ]; then
            TITLE=$(head -n 1 "$NOTES" | sed 's/^# *//')
            tail -n +2 "$NOTES" > notes.md
          else
            TITLE="v$V"
            git log -1 --format=%B > notes.md
          fi
          printf '\n---\nSHA-256 of %s:\n\n```\n%s\n```\n' "$APK" "$(cut -d' ' -f1 "$APK.sha256")" >> notes.md
          gh release create "v$V" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
